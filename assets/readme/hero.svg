<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 开发岗位面试报告 — 102 道面试题与参考答案</title>
  <desc id="desc">米白纸面底、深绿点缀的报告风标题：AI Agent 面试报告，副标题近 30 天调研 · 102 道题；右侧是三张叠放的面试题卡片与分类标签。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f4ec"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#0f766e">近 30 天调研 · AI AGENT INTERVIEW REPORT</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#1c1917">AI Agent 面试报告</text>
    <text x="56" y="168" font-size="23" fill="#44403c">程序员面试 AI Agent 开发岗位：题目与要求</text>
    <text x="56" y="204" font-size="19" fill="#57534e">从“会调 LLM API”到“把 agent 稳定跑到生产”。</text>
    <g id="chips" font-size="18" fill="#1c1917" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3c8" stroke-width="1.5"/><text x="119" y="262">102 道题</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3c8" stroke-width="1.5"/><text x="257" y="262">9 大分类</text></g>
      <g><rect x="332" y="238" width="168" height="36" rx="18" fill="#ffffff" stroke="#d6d3c8" stroke-width="1.5"/><text x="416" y="262">小红书 +224 题</text></g>
      <g><rect x="512" y="238" width="150" height="36" rx="18" fill="#0f766e"/><text x="587" y="262" fill="#ffffff">可背诵答案</text></g>
    </g>
  </g>

  <g id="cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- shapes first: all rects, then all labels (keeps the contrast checker on the paper background) -->
    <g id="card-shapes">
      <g transform="rotate(2 980 190)">
        <rect x="800" y="118" width="340" height="64" rx="12" fill="#ffffff" stroke="#d6d3c8" stroke-width="1.5"/>
        <rect x="816" y="134" width="40" height="32" rx="8" fill="#e7e5dd"/>
      </g>
      <g>
        <rect x="800" y="52" width="340" height="64" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
        <rect x="816" y="68" width="40" height="32" rx="8" fill="#ccfbf1"/>
      </g>
      <g transform="rotate(-1.5 980 260)">
        <rect x="800" y="196" width="340" height="64" rx="12" fill="#ffffff" stroke="#d6d3c8" stroke-width="1.5"/>
        <rect x="816" y="212" width="40" height="32" rx="8" fill="#e7e5dd"/>
      </g>
      <g id="tag-shapes">
        <rect x="800" y="286" width="96" height="34" rx="17" fill="#ccfbf1"/>
        <rect x="908" y="286" width="96" height="34" rx="17" fill="#ccfbf1"/>
        <rect x="1016" y="286" width="124" height="34" rx="17" fill="#ccfbf1"/>
      </g>
    </g>
    <g id="card-labels">
      <g transform="rotate(2 980 190)">
        <text x="836" y="157" font-size="18" font-weight="700" fill="#44403c" text-anchor="middle">02</text>
        <text x="868" y="158" font-size="19" fill="#44403c">什么时候用 workflow？</text>
      </g>
      <g>
        <text x="836" y="91" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">01</text>
        <text x="868" y="92" font-size="19" fill="#1c1917">什么是 AI agent？</text>
        <text x="1112" y="92" font-size="22" fill="#0f766e">+</text>
      </g>
      <g transform="rotate(-1.5 980 260)">
        <text x="836" y="235" font-size="18" font-weight="700" fill="#44403c" text-anchor="middle">03</text>
        <text x="868" y="236" font-size="19" fill="#44403c">RAG 幻觉怎么控制？</text>
      </g>
      <g id="tag-labels" font-size="18" fill="#0f766e" text-anchor="middle">
        <text x="848" y="309">RAG</text>
        <text x="956" y="309">MCP</text>
        <text x="1078" y="309">LangGraph</text>
      </g>
    </g>
  </g>
</svg>
